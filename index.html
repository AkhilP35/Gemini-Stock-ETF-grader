<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Analysis Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>📈 Stock Analysis AI</h1>
        <p class="subtitle">Powered by Gemini AI</p>
        
        <div class="card">
            <h2>Analyze Stock</h2>
            <form id="analysisForm">
                <div class="form-group">
                    <label for="ticker">Stock Ticker</label>
                    <input type="text" id="ticker" placeholder="AAPL" required>
                </div>
                
                <div class="form-group">
                    <label for="movingAverage">30-Day Moving Average</label>
                    <input type="number" id="movingAverage" step="0.01" placeholder="150.00" required>
                </div>
                
                <div class="form-group">
                    <label for="closingPrices">Daily Closing Prices (comma-separated)</label>
                    <textarea id="closingPrices" rows="3" placeholder="145.2, 146.8, 148.1, ..." required></textarea>
                </div>
                
                <button type="submit" id="analyzeBtn">
                    🔍 Analyze Stock
                </button>
            </form>
        </div>
        
        <div id="result" class="result hidden">
            <h2>Analysis Results</h2>
            <div class="result-grid">
                <div class="result-item">
                    <span class="label">Ticker</span>
                    <span id="resultTicker" class="value"></span>
                </div>
                <div class="result-item">
                    <span class="label">Signal</span>
                    <span id="resultSignal" class="value signal"></span>
                </div>
                <div class="result-item">
                    <span class="label">Risk Score</span>
                    <span id="resultRisk" class="value"></span>
                </div>
                <div class="result-item full-width">
                    <span class="label">Analysis</span>
                    <span id="resultAnalysis" class="value"></span>
                </div>
                <div class="result-item full-width">
                    <span class="label">Reasoning</span>
                    <span id="resultReasoning" class="value"></span>
                </div>
            </div>
        </div>
        
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Analyzing stock data...</p>
        </div>
        
        <div id="error" class="error hidden"></div>
    </div>

    <script>
        document.getElementById('analysisForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const ticker = document.getElementById('ticker').value;
            const movingAverage = parseFloat(document.getElementById('movingAverage').value);
            const closingPricesStr = document.getElementById('closingPrices').value;
            const closingPrices = closingPricesStr.split(',').map(p => parseFloat(p.trim()));
            
            // Hide previous results
            document.getElementById('result').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');
            
            // Show loading
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('analyzeBtn').disabled = true;
            
            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        ticker: ticker,
                        moving_average: movingAverage,
                        closing_prices: closingPrices
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Analysis failed');
                }
                
                const data = await response.json();
                
                // Display results
                document.getElementById('resultTicker').textContent = data.ticker;
                document.getElementById('resultSignal').textContent = data.signal;
                document.getElementById('resultRisk').textContent = data.risk_score + '/10';
                document.getElementById('resultAnalysis').textContent = data.analysis;
                document.getElementById('resultReasoning').textContent = data.reasoning;
                
                // Color code the signal
                const signalElement = document.getElementById('resultSignal');
                signalElement.className = 'value signal';
                if (data.signal === 'BUY') {
                    signalElement.classList.add('buy');
                } else if (data.signal === 'SELL') {
                    signalElement.classList.add('sell');
                } else {
                    signalElement.classList.add('hold');
                }
                
                document.getElementById('result').classList.remove('hidden');
                
            } catch (error) {
                document.getElementById('error').textContent = 'Error: ' + error.message;
                document.getElementById('error').classList.remove('hidden');
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('analyzeBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
